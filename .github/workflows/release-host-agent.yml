name: Release host agent

# Builds the `pocketshell` binary for macOS (Apple Silicon + Intel) and Linux
# x86_64, attaches them to a GitHub Release.
#
# Trigger: push of a tag matching v* (e.g. `v0.1.0`).
#   git tag v0.1.0 && git push origin v0.1.0
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   POCKETSHELL_DEFAULT_BACKEND_URL  e.g. https://api.pocketshell.app
#   POCKETSHELL_DEFAULT_WS_URL       e.g. wss://api.pocketshell.app/ws/host
# These are baked into the binary at compile time via option_env! in
# crates/host-core/src/config.rs. Without them the binary will start with
# empty defaults and refuse to connect.

on:
  push:
    tags:
      - 'v*'

# Prevent two release runs from racing on the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-26
            strip: strip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            strip: strip
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            strip: strip
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            strip: strip
            cross_apt: musl-tools
    runs-on: ${{ matrix.os }}
    env:
      # Production backend URLs are injected at compile time via option_env!
      # in crates/host-core/src/config.rs. Empty values would produce a
      # broken binary, so we fail loudly if the secrets aren't set.
      POCKETSHELL_DEFAULT_BACKEND_URL: ${{ secrets.POCKETSHELL_DEFAULT_BACKEND_URL }}
      POCKETSHELL_DEFAULT_WS_URL: ${{ secrets.POCKETSHELL_DEFAULT_WS_URL }}
      # Re-bind matrix values into env so shell scripts never interpolate
      # workflow expressions directly (defense-in-depth against actions
      # injection, even though these values are workflow-controlled).
      TARGET: ${{ matrix.target }}
      STRIP_BIN: ${{ matrix.strip }}
      CROSS_APT: ${{ matrix.cross_apt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify backend URL secrets are set
        shell: bash
        run: |
          if [ -z "$POCKETSHELL_DEFAULT_BACKEND_URL" ] || [ -z "$POCKETSHELL_DEFAULT_WS_URL" ]; then
            echo "::error::POCKETSHELL_DEFAULT_BACKEND_URL and POCKETSHELL_DEFAULT_WS_URL must be set as repository secrets."
            exit 1
          fi

      - name: Set workspace version from tag
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Strip leading "v" (workspace.package.version is bare semver).
          VERSION="${REF_NAME#v}"
          # Defensive: reject anything that isn't pure semver-ish to keep the
          # value safe to interpolate into sed.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::tag $REF_NAME does not look like a version (got '$VERSION')"
            exit 1
          fi
          # Portable sed -i (works on GNU + BSD). Cargo.toml has exactly one
          # ^version = "..." line under [workspace.package]; dependency lines
          # are `name = { version = "..." }` and not matched by the ^ anchor.
          sed -i.bak -E "s/^version = \"[^\"]+\"/version = \"${VERSION}\"/" Cargo.toml
          rm -f Cargo.toml.bak
          echo "--- bumped workspace version ---"
          grep -nE '^version = ' Cargo.toml

      - name: Install cross-compile toolchain
        if: matrix.cross_apt != ''
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y $CROSS_APT

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: cargo build --release --target "$TARGET" -p host-agent

      - name: Strip binary
        shell: bash
        run: $STRIP_BIN "target/$TARGET/release/pocketshell"

      # Sign the macOS binary with a Developer ID Application cert so the
      # keychain ACL (host agent stores ED25519 priv key + refresh token via
      # the `keyring` crate) remains stable across versions — without a stable
      # signing identity, every new build's hash invalidates the ACL and the
      # user gets "pocketshell wants to access your keychain" on every update.
      - name: Import code signing certificate (macOS only)
        if: runner.os == 'macOS'
        uses: Apple-Actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}

      - name: Codesign binary (macOS only)
        if: runner.os == 'macOS'
        env:
          IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_NAME }}
        run: |
          bin="target/$TARGET/release/pocketshell"
          codesign --force --timestamp --options runtime \
            --sign "$IDENTITY" "$bin"
          codesign --verify --strict --verbose=2 "$bin"

      - name: Verify --version matches tag
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Every runner is native-arch for its target (macos-26 arm64,
          # ubuntu-latest x64, ubuntu-24.04-arm arm64, musl runs on glibc),
          # so the produced binary is executable here.
          bin="target/$TARGET/release/pocketshell"
          EXPECTED="pocketshell ${REF_NAME#v}"
          ACTUAL="$("$bin" --version)"
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::binary --version output ($ACTUAL) doesn't match tag ($EXPECTED). The 'Set workspace version from tag' step failed or didn't propagate to the build."
            exit 1
          fi

      - name: Verify backend URL was baked in
        shell: bash
        run: |
          bin="target/$TARGET/release/pocketshell"
          echo "looking for: $POCKETSHELL_DEFAULT_BACKEND_URL"
          echo "binary size: $(wc -c < "$bin") bytes"
          if LC_ALL=C grep -aoF "$POCKETSHELL_DEFAULT_BACKEND_URL" "$bin" | head -1; then
            echo "✓ backend URL baked into $bin"
          else
            echo "::error::Backend URL not found in compiled binary. option_env! injection failed."
            echo "--- first 5 http/wss strings in binary (for debug) ---"
            LC_ALL=C grep -aoE '(https?|wss?)://[A-Za-z0-9._/:-]+' "$bin" | sort -u | head -5 || true
            exit 1
          fi

      - name: Package
        shell: bash
        run: |
          cd "target/$TARGET/release"
          archive="pocketshell-${GITHUB_REF_NAME}-${TARGET}.tar.gz"
          tar -czf "$archive" pocketshell
          shasum -a 256 "$archive" > "$archive.sha256"
          ls -la "$archive" "$archive.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketshell-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/pocketshell-*.tar.gz
            target/${{ matrix.target }}/release/pocketshell-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show artifacts
        shell: bash
        run: ls -la dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/pocketshell-*.tar.gz
            dist/pocketshell-*.tar.gz.sha256
