name: Release host agent

# Builds the `pocketshell` binary for macOS (Apple Silicon + Intel) and Linux
# x86_64, attaches them to a GitHub Release.
#
# Trigger: push of a tag matching v* (e.g. `v0.1.0`).
#   git tag v0.1.0 && git push origin v0.1.0
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   POCKETSHELL_DEFAULT_BACKEND_URL  e.g. https://api.pocketshell.app
#   POCKETSHELL_DEFAULT_WS_URL       e.g. wss://api.pocketshell.app/ws/host
# These are baked into the binary at compile time via option_env! in
# crates/host-core/src/config.rs. Without them the binary will start with
# empty defaults and refuse to connect.
#
# The Apple Team ID is pinned in crates/host-core/src/update.rs (it's not
# secret — it's visible via `codesign -dv` on any shipped binary), and the
# in-binary `pocketshell update` rejects a downloaded macOS binary that
# doesn't match Apple anchor + Developer ID Application leaf + that Team ID.

on:
  push:
    tags:
      - 'v*'

# Prevent two release runs from racing on the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Required for cosign keyless signing — exchanges the workflow's OIDC token
  # for an ephemeral Fulcio cert tied to this repo + workflow identity. The
  # in-binary updater in crates/host-core/src/update.rs pins that identity at
  # verify time, so a compromise of the GitHub Releases publishing flow alone
  # is not sufficient to push a malicious binary; an attacker would also need
  # an OIDC token from this specific workflow path.
  id-token: write

jobs:
  build:
    if: github.event_name == 'push'
    name: build / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-26
            strip: strip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            strip: strip
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            strip: strip
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            strip: strip
            cross_apt: musl-tools
          # Windows x86_64 (MSVC). No strip (MSVC keeps debug info in a
          # separate .pdb, which we don't ship — nothing to strip from the
          # .exe) and no codesign (shipped unsigned for v1; self-update
          # authenticity is still enforced via cosign + SHA-256). Distributed
          # via npm only (@pocketshell/win32-x64-msvc); the GitHub Release
          # tarball exists so publish-npm.yml can repackage it.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            strip: ''
    runs-on: ${{ matrix.os }}
    env:
      # Production backend URLs are injected at compile time via option_env!
      # in crates/host-core/src/config.rs. Empty values would produce a
      # broken binary, so we fail loudly if the secrets aren't set.
      POCKETSHELL_DEFAULT_BACKEND_URL: ${{ secrets.POCKETSHELL_DEFAULT_BACKEND_URL }}
      POCKETSHELL_DEFAULT_WS_URL: ${{ secrets.POCKETSHELL_DEFAULT_WS_URL }}
      # Re-bind matrix values into env so shell scripts never interpolate
      # workflow expressions directly (defense-in-depth against actions
      # injection, even though these values are workflow-controlled).
      TARGET: ${{ matrix.target }}
      STRIP_BIN: ${{ matrix.strip }}
      CROSS_APT: ${{ matrix.cross_apt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify backend URL secrets are set
        shell: bash
        run: |
          if [ -z "$POCKETSHELL_DEFAULT_BACKEND_URL" ] || [ -z "$POCKETSHELL_DEFAULT_WS_URL" ]; then
            echo "::error::POCKETSHELL_DEFAULT_BACKEND_URL and POCKETSHELL_DEFAULT_WS_URL must be set as repository secrets."
            exit 1
          fi

      - name: Set workspace version from tag
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Strip leading "v" (workspace.package.version is bare semver).
          VERSION="${REF_NAME#v}"
          # Defensive: reject anything that isn't pure semver-ish to keep the
          # value safe to interpolate into sed.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::tag $REF_NAME does not look like a version (got '$VERSION')"
            exit 1
          fi
          # Portable sed -i (works on GNU + BSD). Cargo.toml has exactly one
          # ^version = "..." line under [workspace.package]; dependency lines
          # are `name = { version = "..." }` and not matched by the ^ anchor.
          sed -i.bak -E "s/^version = \"[^\"]+\"/version = \"${VERSION}\"/" Cargo.toml
          rm -f Cargo.toml.bak
          echo "--- bumped workspace version ---"
          grep -nE '^version = ' Cargo.toml

      - name: Install cross-compile toolchain
        if: matrix.cross_apt != ''
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y $CROSS_APT

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: cargo build --release --target "$TARGET" -p host-agent

      - name: Strip binary
        if: matrix.strip != ''
        shell: bash
        run: $STRIP_BIN "target/$TARGET/release/pocketshell"

      # Sign the macOS binary with a Developer ID Application cert so the
      # keychain ACL (host agent stores ED25519 priv key + refresh token via
      # the `keyring` crate) remains stable across versions — without a stable
      # signing identity, every new build's hash invalidates the ACL and the
      # user gets "pocketshell wants to access your keychain" on every update.
      - name: Import code signing certificate (macOS only)
        if: runner.os == 'macOS'
        uses: Apple-Actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}

      - name: Codesign binary (macOS only)
        if: runner.os == 'macOS'
        env:
          IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_NAME }}
        run: |
          bin="target/$TARGET/release/pocketshell"
          codesign --force --timestamp --options runtime \
            --sign "$IDENTITY" "$bin"
          codesign --verify --strict --verbose=2 "$bin"

      - name: Verify --version matches tag
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Every runner is native-arch for its target (macos-26 arm64,
          # ubuntu-latest x64, ubuntu-24.04-arm arm64, musl runs on glibc),
          # so the produced binary is executable here.
          bin="target/$TARGET/release/pocketshell"
          [ "$RUNNER_OS" = "Windows" ] && bin="$bin.exe"
          EXPECTED="pocketshell ${REF_NAME#v}"
          ACTUAL="$("$bin" --version)"
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::binary --version output ($ACTUAL) doesn't match tag ($EXPECTED). The 'Set workspace version from tag' step failed or didn't propagate to the build."
            exit 1
          fi

      - name: Verify backend URL was baked in
        shell: bash
        run: |
          bin="target/$TARGET/release/pocketshell"
          [ "$RUNNER_OS" = "Windows" ] && bin="$bin.exe"
          echo "looking for: $POCKETSHELL_DEFAULT_BACKEND_URL"
          echo "binary size: $(wc -c < "$bin") bytes"
          if LC_ALL=C grep -aoF "$POCKETSHELL_DEFAULT_BACKEND_URL" "$bin" | head -1; then
            echo "✓ backend URL baked into $bin"
          else
            echo "::error::Backend URL not found in compiled binary. option_env! injection failed."
            echo "--- first 5 http/wss strings in binary (for debug) ---"
            LC_ALL=C grep -aoE '(https?|wss?)://[A-Za-z0-9._/:-]+' "$bin" | sort -u | head -5 || true
            exit 1
          fi

      - name: Package
        shell: bash
        run: |
          cd "target/$TARGET/release"
          binname=pocketshell
          [ "$RUNNER_OS" = "Windows" ] && binname=pocketshell.exe
          archive="pocketshell-${GITHUB_REF_NAME}-${TARGET}.tar.gz"
          tar -czf "$archive" "$binname"
          # Git-bash on Windows runners ships `sha256sum` (coreutils) but not the
          # Perl `shasum` that macOS/Linux runners have. Both emit the same
          # "<hex>  <file>" format that update.rs / install.sh / publish-npm verify.
          if [ "$RUNNER_OS" = "Windows" ]; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          ls -la "$archive" "$archive.sha256"

      # Sigstore cosign keyless signing. Pinned to v2.6.3 (latest v2.x stable
      # as of April 2026). cosign v3.x dropped the legacy detached `.sig` files
      # in favor of self-signed bundles, but cosign-installer v3.8.1 hasn't
      # caught up to that format change yet — so install fails on v3.x with a
      # 404 on the missing .sig URL. v2.6.3 supports --new-bundle-format
      # (added in v2.5) so we still get the modern protobuf bundle format.
      # Re-evaluate the v3 pin once a newer cosign-installer ships that
      # handles v3 signature verification.
      #
      # The installer action is itself pinned to a commit SHA so a compromise
      # of the action's release tags can't silently swap in a malicious cosign.
      - name: Install cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1
        with:
          cosign-release: 'v2.6.3'

      # `cosign sign-blob --new-bundle-format` produces a single self-contained
      # bundle (signature + ephemeral Fulcio cert + Rekor SET) that the
      # in-binary updater verifies entirely offline. The bundle format is
      # required by cosign v3 anyway; flagging it explicitly keeps us
      # forward-compatible if defaults shift again.
      - name: Sign release artifact with cosign
        shell: bash
        env:
          # cosign-installer exports COSIGN_YES=true by default; making it
          # explicit here surfaces intent. The keyless flow uses the workflow's
          # OIDC token to mint a 10-minute Fulcio cert — see the id-token
          # permission at the top of this workflow.
          COSIGN_YES: "true"
        run: |
          cd "target/$TARGET/release"
          archive="pocketshell-${GITHUB_REF_NAME}-${TARGET}.tar.gz"
          cosign sign-blob \
            --yes \
            --new-bundle-format \
            --bundle "${archive}.cosign-bundle.json" \
            "$archive"
          # Sanity-check the bundle is well-formed against the same pinned
          # identity the in-binary updater will require. Catches workflow
          # path drift (e.g. renaming this file) before users do.
          cosign verify-blob \
            --new-bundle-format \
            --bundle "${archive}.cosign-bundle.json" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-host-agent.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          ls -la "$archive" "${archive}.sha256" "${archive}.cosign-bundle.json"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketshell-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/pocketshell-*.tar.gz
            target/${{ matrix.target }}/release/pocketshell-*.tar.gz.sha256
            target/${{ matrix.target }}/release/pocketshell-*.tar.gz.cosign-bundle.json
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show artifacts
        shell: bash
        run: ls -la dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            dist/pocketshell-*.tar.gz
            dist/pocketshell-*.tar.gz.sha256
            dist/pocketshell-*.tar.gz.cosign-bundle.json
