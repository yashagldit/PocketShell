name: Release host agent

# Builds the `pocketshell` binary for macOS (Apple Silicon + Intel) and Linux
# x86_64, attaches them to a GitHub Release.
#
# Trigger: push of a tag matching v* (e.g. `v0.1.0`).
#   git tag v0.1.0 && git push origin v0.1.0
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   POCKETSHELL_DEFAULT_BACKEND_URL  e.g. https://api.pocketshell.app
#   POCKETSHELL_DEFAULT_WS_URL       e.g. wss://api.pocketshell.app/ws/host
# These are baked into the binary at compile time via option_env! in
# crates/host-core/src/config.rs. Without them the binary will start with
# empty defaults and refuse to connect.

on:
  push:
    tags:
      - 'v*'

# Prevent two release runs from racing on the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            strip: strip
          - target: x86_64-apple-darwin
            os: macos-13
            strip: strip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            strip: strip
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            strip: aarch64-linux-gnu-strip
            cross_apt: gcc-aarch64-linux-gnu
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            strip: strip
            cross_apt: musl-tools
    runs-on: ${{ matrix.os }}
    env:
      # Production backend URLs are injected at compile time via option_env!
      # in crates/host-core/src/config.rs. Empty values would produce a
      # broken binary, so we fail loudly if the secrets aren't set.
      POCKETSHELL_DEFAULT_BACKEND_URL: ${{ secrets.POCKETSHELL_DEFAULT_BACKEND_URL }}
      POCKETSHELL_DEFAULT_WS_URL: ${{ secrets.POCKETSHELL_DEFAULT_WS_URL }}
      # Re-bind matrix values into env so shell scripts never interpolate
      # workflow expressions directly (defense-in-depth against actions
      # injection, even though these values are workflow-controlled).
      TARGET: ${{ matrix.target }}
      STRIP_BIN: ${{ matrix.strip }}
      CROSS_APT: ${{ matrix.cross_apt }}
      # Cargo only reads the per-target linker var when building that target,
      # so setting these unconditionally on Linux runners is safe.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify backend URL secrets are set
        shell: bash
        run: |
          if [ -z "$POCKETSHELL_DEFAULT_BACKEND_URL" ] || [ -z "$POCKETSHELL_DEFAULT_WS_URL" ]; then
            echo "::error::POCKETSHELL_DEFAULT_BACKEND_URL and POCKETSHELL_DEFAULT_WS_URL must be set as repository secrets."
            exit 1
          fi

      - name: Install cross-compile toolchain
        if: matrix.cross_apt != ''
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y $CROSS_APT

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: cargo build --release --target "$TARGET" -p host-agent

      - name: Strip binary
        shell: bash
        run: $STRIP_BIN "target/$TARGET/release/pocketshell"

      - name: Verify backend URL was baked in
        shell: bash
        run: |
          bin="target/$TARGET/release/pocketshell"
          if ! strings -a "$bin" | grep -qF "$POCKETSHELL_DEFAULT_BACKEND_URL"; then
            echo "::error::Backend URL not found in compiled binary. option_env! injection failed."
            exit 1
          fi
          echo "✓ backend URL baked into $bin"

      - name: Package
        shell: bash
        run: |
          cd "target/$TARGET/release"
          archive="pocketshell-${GITHUB_REF_NAME}-${TARGET}.tar.gz"
          tar -czf "$archive" pocketshell
          shasum -a 256 "$archive" > "$archive.sha256"
          ls -la "$archive" "$archive.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketshell-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/pocketshell-*.tar.gz
            target/${{ matrix.target }}/release/pocketshell-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show artifacts
        shell: bash
        run: ls -la dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/pocketshell-*.tar.gz
            dist/pocketshell-*.tar.gz.sha256
